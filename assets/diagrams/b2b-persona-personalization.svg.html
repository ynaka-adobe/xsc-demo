<html><body style="margin:0;background:#fff">
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890" font-family="Adobe Clean, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8481c"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b63fb"/></marker>
</defs>
<style>.t{font-size:19px;font-weight:700;fill:#111}.s{font-size:14.5px;fill:#333}.l{font-size:14px;font-weight:700;fill:#666;letter-spacing:2px}.c{font-family:Menlo,monospace;font-size:13px;fill:#333}.p{font-size:13px;font-weight:700;fill:#fff}</style>

<text x="40" y="45" class="l">1 · TAG CONTENT (AUTHOR TIME)</text>
<text x="500" y="45" class="l">2 · RESOLVE PERSONA (RUNTIME)</text>
<text x="960" y="45" class="l">3 · PERSONALIZE AT THE EDGE</text>

<!-- column 1 -->
<rect x="40" y="70" width="400" height="100" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="240" y="108" text-anchor="middle" class="t">~2,000 articles &amp; content pages</text>
<text x="240" y="135" text-anchor="middle" class="s">products, solutions, ESG, blogs, support</text>
<line x1="240" y1="170" x2="240" y2="205" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="210" width="400" height="120" rx="10" fill="#fff1ec" stroke="#e8481c" stroke-width="2"/>
<text x="240" y="248" text-anchor="middle" class="t">Coworker AI agent</text>
<text x="240" y="275" text-anchor="middle" class="s">reads every page, scores it against</text>
<text x="240" y="295" text-anchor="middle" class="s">the 4 persona definitions + intent map,</text>
<text x="240" y="315" text-anchor="middle" class="s">proposes tags for author review</text>
<line x1="240" y1="330" x2="240" y2="365" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="370" width="400" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="240" y="405" text-anchor="middle" class="t">Page metadata</text>
<text x="240" y="432" text-anchor="middle" class="c">persona: technical, procurement</text>
<text x="240" y="452" text-anchor="middle" class="c">region: global | na | emea | apac</text>
<line x1="240" y1="470" x2="240" y2="505" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="510" width="400" height="90" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="240" y="545" text-anchor="middle" class="t">query-index.json</text>
<text x="240" y="572" text-anchor="middle" class="s">persona + region columns, queryable at the edge</text>

<!-- column 2 -->
<rect x="500" y="70" width="400" height="160" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="700" y="105" text-anchor="middle" class="t">Visitor signals</text>
<text x="700" y="133" text-anchor="middle" class="s">pages and topics viewed (intent map)</text>
<text x="700" y="155" text-anchor="middle" class="s">downloads, forms, referrer, search terms</text>
<text x="700" y="177" text-anchor="middle" class="s">known profile / CRM / RT-CDP audience</text>
<text x="700" y="199" text-anchor="middle" class="s">geo → region</text>
<line x1="700" y1="230" x2="700" y2="265" stroke="#3b63fb" stroke-width="2" marker-end="url(#b)"/>
<rect x="500" y="270" width="400" height="90" rx="10" fill="#e8edff" stroke="#3b63fb" stroke-width="2"/>
<text x="700" y="305" text-anchor="middle" class="t">Visitor profile</text>
<text x="700" y="332" text-anchor="middle" class="s">one of 4 personas (or none) + region</text>
<!-- persona chips -->
<rect x="500" y="390" width="195" height="44" rx="22" fill="#1b1b1b"/><text x="597" y="417" text-anchor="middle" class="p">Technical Evaluator</text>
<rect x="705" y="390" width="195" height="44" rx="22" fill="#1b1b1b"/><text x="802" y="417" text-anchor="middle" class="p">Business Decision Maker</text>
<rect x="500" y="444" width="195" height="44" rx="22" fill="#1b1b1b"/><text x="597" y="471" text-anchor="middle" class="p">Procurement &amp; Sourcing</text>
<rect x="705" y="444" width="195" height="44" rx="22" fill="#1b1b1b"/><text x="802" y="471" text-anchor="middle" class="p">Industry Researcher</text>
<text x="700" y="525" text-anchor="middle" class="s">no persona → default (unfiltered) experience</text>

<!-- column 3 -->
<rect x="960" y="70" width="400" height="110" rx="10" fill="#fff1ec" stroke="#e8481c" stroke-width="2"/>
<text x="1160" y="105" text-anchor="middle" class="t">Hero / banner</text>
<text x="1160" y="132" text-anchor="middle" class="s">swaps to the persona's banner + CTA</text>
<text x="1160" y="154" text-anchor="middle" class="s">spec sheets · ROI · supplier docs · learn</text>
<rect x="960" y="200" width="400" height="130" rx="10" fill="#fff1ec" stroke="#e8481c" stroke-width="2"/>
<text x="1160" y="235" text-anchor="middle" class="t">Cards · hero lists · search results</text>
<text x="1160" y="262" text-anchor="middle" class="s">query-index filtered (or boosted) by</text>
<text x="1160" y="284" text-anchor="middle" class="s">the visitor's persona tag; falls back</text>
<text x="1160" y="306" text-anchor="middle" class="s">to all content when no persona</text>
<rect x="960" y="350" width="400" height="140" rx="10" fill="#e6f6ee" stroke="#0b8a4a" stroke-width="2"/>
<text x="1160" y="385" text-anchor="middle" class="t">Fragment includes</text>
<text x="1160" y="412" text-anchor="middle" class="c">/fragments/{region}/… → regional</text>
<text x="1160" y="434" text-anchor="middle" class="c">/fragments/global/…   → root</text>
<text x="1160" y="461" text-anchor="middle" class="s">trademark names, legal lines, contacts</text>
<rect x="960" y="510" width="400" height="90" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="1160" y="545" text-anchor="middle" class="t">Measure</text>
<text x="1160" y="572" text-anchor="middle" class="s">RUM + analytics per persona: CTR, conversions</text>

<!-- arrows -->
<path d="M440,560 L465,560 L465,628 L928,628 L928,280 L955,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M440,450 L452,450 L452,642 L942,642 L942,440 L955,440" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<line x1="900" y1="300" x2="955" y2="140" stroke="#3b63fb" stroke-width="2" marker-end="url(#b)"/>
<line x1="900" y1="315" x2="955" y2="270" stroke="#3b63fb" stroke-width="2" marker-end="url(#b)"/>
<line x1="900" y1="330" x2="955" y2="400" stroke="#3b63fb" stroke-width="2" marker-end="url(#b)"/>

<!-- footer band -->
<rect x="40" y="680" width="1320" height="170" rx="12" fill="#1b1b1b"/>
<text x="70" y="720" class="l" style="fill:#e8481c">THREE PERSONALIZATION LAYERS</text>
<text x="70" y="758" class="t" style="fill:#fff">1. Banner + CTA swap</text>
<text x="70" y="785" class="s" style="fill:#ccc">Same page, persona-relevant headline and call to action.</text>
<text x="500" y="758" class="t" style="fill:#fff">2. Persona-filtered lists</text>
<text x="500" y="785" class="s" style="fill:#ccc">AI-tagged content drives cards, hero lists and results.</text>
<text x="930" y="758" class="t" style="fill:#fff">3. Region vs. global fragments</text>
<text x="930" y="785" class="s" style="fill:#ccc">Regional include when it exists, global root otherwise.</text>
<text x="70" y="825" class="s" style="fill:#999">All composed by Edge Delivery blocks in the browser/edge: no extra runtime, authors keep editing documents.</text>
</svg></body></html>
