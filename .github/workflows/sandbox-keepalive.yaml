name: AEM sandbox keep-alive

# Sandbox programs hibernate after 8 hours without requests to author, preview, or publish.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping publish
        run: |
          ts=$(date +%s)
          fail=0
          for url in \
            "https://publish-p154856-e1944736.adobeaemcloud.com/?keepalive=$ts" \
            "https://publish-p154856-e1944904.adobeaemcloud.com/content/demo/en/home.html?keepalive=$ts" \
            "https://publish-p154856-e2305186.adobeaemcloud.com/content/demo/en/home.html?keepalive=$ts"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -m 60 "$url" || echo 000)
            echo "$code $url"
            if grep -qi 'hibernat' /tmp/body; then
              echo "::error::Sandbox appears hibernated. De-hibernate it in the Cloud Manager Developer Console."
              fail=1
            elif [ "$code" -ge 500 ] || [ "$code" = 000 ]; then
              echo "::error::Unexpected response $code from $url"
              fail=1
            fi
          done
          exit $fail
